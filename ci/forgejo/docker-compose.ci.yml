# Stack de CI: Forgejo + runner + Docker-in-Docker.
# SEPARADO del docker-compose.yml de desarrollo (R1).
# Nombre de proyecto distinto: inmobiliaria-ci vs inmobiliaria.
#
# Ejecutar desde ci/forgejo/:
#   docker compose --env-file .env -f docker-compose.ci.yml up -d

name: inmobiliaria-ci

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.1
    container_name: forgejo-ci
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__server__ROOT_URL=${FORGEJO_ROOT_URL}
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_PORT=${FORGEJO_SSH_PORT}
      - FORGEJO__server__DOMAIN=127.0.0.1
    ports:
      - "${FORGEJO_BIND}:${FORGEJO_HTTP_PORT}:3000"
      - "${FORGEJO_BIND}:${FORGEJO_SSH_PORT}:22"
    volumes:
      - forgejo-datos:/data
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ci-net

  docker:
    image: docker:27.5.1-dind
    container_name: forgejo-dind
    restart: unless-stopped
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - dind-datos:/var/lib/docker
    networks:
      - ci-net

  runner:
    image: data.forgejo.org/forgejo/runner:12
    container_name: forgejo-runner
    restart: unless-stopped
    command: ["/bin/forgejo-runner", "daemon", "--config", "/data/config.yaml"]
    depends_on:
      forgejo:
        condition: service_healthy
      docker:
        condition: service_started
    environment:
      - DOCKER_HOST=tcp://docker:2375
      - TESTCONTAINERS_HOST_OVERRIDE=docker
    volumes:
      - runner-datos:/data
    networks:
      - ci-net

volumes:
  forgejo-datos:
    name: forgejo-ci-datos
  dind-datos:
    name: forgejo-ci-dind-datos
  runner-datos:
    name: forgejo-ci-runner-datos

networks:
  ci-net:
